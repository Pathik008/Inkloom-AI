services:
  db:
    image: pgvector/pgvector:pg16
    container_name: inkloom-prod-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-inkloom_prod_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database password must be set}
      POSTGRES_DB: ${POSTGRES_DB:-inkloom_prod_db}
    volumes:
      - inkloom_prod_pgdata:/var/lib/postgresql/data
      - ./infra/init-pgvector.sql:/docker-entrypoint-initdb.d/01-init-pgvector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-inkloom_prod_user} -d ${POSTGRES_DB:-inkloom_prod_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: inkloom-prod-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: production
      DEBUG: "false"
      HOST: 0.0.0.0
      PORT: 8000
      SECRET_KEY: ${SECRET_KEY:?Production SECRET_KEY must be configured}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-inkloom_prod_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-inkloom_prod_db}
      ALLOW_SQLITE_DEV_FALLBACK: "false"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://localhost:80,https://app.inkloom.ai}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    container_name: inkloom-prod-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${PORT:-80}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  inkloom_prod_pgdata:
    name: inkloom_prod_pgdata
