services:
  db:
    image: pgvector/pgvector:pg16
    container_name: inkloom-postgres-pgvector
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-inkloom_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-inkloom_dev_password_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-inkloom_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - inkloom_pgdata:/var/lib/postgresql/data
      - ./init-pgvector.sql:/docker-entrypoint-initdb.d/01-init-pgvector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-inkloom_user} -d ${POSTGRES_DB:-inkloom_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  inkloom_pgdata:
    name: inkloom_pgdata
